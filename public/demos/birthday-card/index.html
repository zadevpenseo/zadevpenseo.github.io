<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Birthday Card Live Demo</title>
  <style>
    :root {
      --bg-color: #0d0b10;
      --card-front: #1c1322;
      --card-inside: #2a1b33;
      --gold: #c5a059;
      --gold-light: #e6c887;
      --text-light: #f5f2eb;
      --text-muted: #a69cb0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      perspective: 1200px;
      padding: 20px;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(28, 19, 34, 0.8);
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid rgba(197, 160, 89, 0.3);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .controls input {
      background: transparent;
      border: none;
      color: var(--text-light);
      font-size: 0.9rem;
      outline: none;
      width: 130px;
    }
    .controls input::placeholder {
      color: var(--text-muted);
    }
    .controls button {
      background: var(--gold);
      color: #0d0b10;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .controls button:hover {
      background: var(--gold-light);
    }
    .card-container {
      position: relative;
      width: 320px;
      height: 460px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-container.open {
      transform: rotateY(-140deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backface-visibility: hidden;
      border: 1px solid rgba(197, 160, 89, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .card-front {
      background: linear-gradient(135deg, var(--card-front) 0%, #120917 100%);
      align-items: center;
      text-align: center;
      z-index: 2;
    }
    .card-inside {
      background: linear-gradient(135deg, var(--card-inside) 0%, #1a1020 100%);
      transform: rotateY(180deg);
      text-align: left;
    }
    .badge {
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      padding: 5px 12px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      border-radius: 20px;
    }
    .icon-container {
      margin: 18px 0;
      position: relative;
    }
    .candle {
      width: 16px;
      height: 60px;
      background: linear-gradient(to bottom, #fff, var(--gold));
      border-radius: 8px;
      position: relative;
      margin: 0 auto;
    }
    .flame {
      width: 14px;
      height: 24px;
      background: radial-gradient(ellipse at bottom, #fff 0%, #ffaa00 60%, transparent 100%);
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -26px;
      left: 1px;
      animation: flicker 0.6s infinite alternate;
      cursor: pointer;
    }
    .flame.extinguished {
      display: none;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }
    h1 {
      color: var(--gold-light);
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .instruction {
      font-size: 0.78rem;
      color: var(--gold);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .inside-body {
      color: var(--text-light);
      font-size: 1rem;
      line-height: 1.6;
    }
    .signature {
      color: var(--gold);
      font-style: italic;
      text-align: right;
    }
    canvas#confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="controls">
    <input type="text" id="name-input" placeholder="Type name..." value="Sakshi">
    <button onclick="updateRecipient()">Personalize</button>
  </div>

  <div class="card-container" id="card" onclick="toggleCard()">
    <!-- Front Face -->
    <div class="card-face card-front">
      <span class="badge">Bespoke Greeting</span>
      <div class="icon-container">
        <div class="candle">
          <div class="flame" id="flame" title="Click to blow candle!"></div>
        </div>
      </div>
      <div>
        <h1 id="recipient-title">Happy Birthday, Sakshi!</h1>
        <p>A memorable moment designed exclusively for you.</p>
      </div>
      <span class="instruction">Tap candle or click card to open</span>
    </div>

    <!-- Inside Face -->
    <div class="card-face card-inside">
      <span class="badge">Celebration Wish</span>
      <div class="inside-body" id="wish-text">
        May the year ahead bring endless inspiration, creative breakthroughs, and quiet joy in every milestone achieved.
      </div>
      <div>
        <p class="signature">With Warmest Wishes</p>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const toParam = urlParams.get('to') || urlParams.get('name');
    const msgParam = urlParams.get('msg') || urlParams.get('wish');

    if (toParam) {
      document.getElementById('recipient-title').textContent = 'Happy Birthday, ' + toParam + '!';
      document.getElementById('name-input').value = toParam;
    }
    if (msgParam) {
      document.getElementById('wish-text').textContent = msgParam;
    }

    function updateRecipient() {
      const input = document.getElementById('name-input').value.trim();
      if (input) {
        document.getElementById('recipient-title').textContent = 'Happy Birthday, ' + input + '!';
        triggerConfetti();
        playChime();
      }
    }

    let isOpen = false;
    const card = document.getElementById('card');
    const flame = document.getElementById('flame');

    function playChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const chord = [523.25, 659.25, 783.99, 1046.50];
        chord.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + i * 0.12);
          osc.stop(audioCtx.currentTime + i * 0.12 + 0.7);
        });
      } catch (e) {}
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#c5a059', '#e6c887', '#ff6b6b', '#4ecdc4', '#ffe66d'];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          r: Math.random() * 5 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14 - 3,
          alpha: 1
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = 0;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25;
          p.alpha -= 0.012;
          if (p.alpha > 0) {
            active++;
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });
        if (active > 0) requestAnimationFrame(render);
      }
      render();
    }

    function toggleCard() {
      isOpen = !isOpen;
      card.classList.toggle('open', isOpen);
      if (isOpen) {
        playChime();
        triggerConfetti();
      }
    }

    flame.addEventListener('click', (e) => {
      e.stopPropagation();
      flame.classList.add('extinguished');
      triggerConfetti();
      playChime();
    });
  </script>
</body>
</html>
