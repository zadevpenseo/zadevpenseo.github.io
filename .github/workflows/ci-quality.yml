name: CI Quality Gate & Build Verification

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify Astro Starlight Build & Search Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Build Site & Generate Pagefind WASM Indexes
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || { echo "Fatal: dist/index.html missing"; exit 1; }
          test -d dist/pagefind || { echo "Fatal: dist/pagefind directory missing"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "Fatal: dist/sitemap-index.xml missing"; exit 1; }
          echo "All critical production artifacts verified successfully."
